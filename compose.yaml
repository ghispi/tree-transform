services:
  php:
    build:
      context: docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: tree-transform-php:${PHP_VERSION:-8.4}
    volumes:
      - .:/app
      - composer-cache:/home/app/.composer/cache
    working_dir: /app

  # Documentation site builder (make docs-site); not started by other targets.
  docs:
    build:
      context: docker/docs
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: tree-transform-docs
    profiles: [docs]
    volumes:
      - .:/app
    working_dir: /app

  # Databases for the integration tests (make test-db); not started by other targets.
  mysql:
    image: mysql:8.4
    profiles: [db]
    environment:
      MYSQL_DATABASE: tree_transform
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uapp', '-papp']
      interval: 2s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:17-alpine
    profiles: [db]
    environment:
      POSTGRES_DB: tree_transform
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'app', '-d', 'tree_transform']
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  composer-cache:
