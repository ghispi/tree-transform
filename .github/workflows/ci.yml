name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.4'
            dependencies: lowest
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: make build
      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            docker compose run --rm php composer update --prefer-lowest --prefer-stable --no-interaction
          else
            make install
          fi
      - name: Code style, static analysis, tests
        run: make ci


  databases:
    name: Integration (MySQL, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: make build
      - name: Install dependencies
        run: make install
      - name: Gedmo bridge on MySQL 8.4 and PostgreSQL 17
        run: make test-db

  bc:
    name: Backward compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the checker compares against the latest tag
      - name: Build image
        run: make build
      - name: Install dependencies
        run: make install
      - name: Compare with the latest release
        run: |
          from=$(git describe --tags --abbrev=0)
          case "$from" in
            v0.1.*|v0.2.*)
              # Releases before the API review (0.3.0) are not a baseline: report only. From 1.0 every break fails.
              echo "::notice::Comparing with $from, which predates the API freeze; breaks are reported, not enforced."
              make bc-check BC_FROM="$from" || true
              ;;
            *)
              make bc-check BC_FROM="$from"
              ;;
          esac
